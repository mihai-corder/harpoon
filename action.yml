name: "harpoon smoke test"
description: >-
  Run a harpoon collection as a smoke test: JSON + HTML reports, an HTML
  artifact, and a results table posted as a PR comment.
author: mihai-corder
branding:
  icon: "crosshair"
  color: "purple"

inputs:
  collection:
    description: "Path to the harpoon collection file (relative to the repository)"
    required: true
  env:
    description: "Environment profile name (harpoon.<env>.yaml next to the collection)"
    required: false
    default: ""
  vars:
    description: "Variable overrides, one KEY=VALUE per line"
    required: false
    default: ""
  request:
    description: "Comma-separated subset of request names to run (defaults to all)"
    required: false
    default: ""
  version:
    description: "harpoon version to install (go install github.com/mihai-corder/harpoon@<version>)"
    required: false
    default: "latest"
  comment:
    description: "Post the results table as a PR comment"
    required: false
    default: "true"
  token:
    description: "GitHub token used for the PR comment (defaults to github.token)"
    required: false
    default: ""
  html-artifact:
    description: "Name of the uploaded HTML report artifact (empty disables the upload)"
    required: false
    default: "harpoon-report"
  share:
    description: "Upload the HTML report to a harpoon-share server and link it in the PR comment"
    required: false
    default: "true"
  share-server:
    description: "harpoon-share server base URL used when share is enabled"
    required: false
    default: "https://harpoon-share.1962554030-517.workers.dev"

outputs:
  report:
    description: "Path to the JSON report written by harpoon ci"
    value: "harpoon-report.json"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: stable

    - name: Install harpoon
      shell: bash
      env:
        HARPOON_VERSION: ${{ inputs.version }}
      run: go install "github.com/mihai-corder/harpoon@${HARPOON_VERSION}"

    - name: Run harpoon ci
      id: run
      shell: bash
      env:
        COLLECTION: ${{ inputs.collection }}
        HARPOON_ENV: ${{ inputs.env }}
        HARPOON_REQUEST: ${{ inputs.request }}
        HARPOON_VARS: ${{ inputs.vars }}
      run: |
        args=(ci "$COLLECTION" --json harpoon-report.json --html harpoon-report.html)
        [ -n "$HARPOON_ENV" ] && args+=(--env "$HARPOON_ENV")
        [ -n "$HARPOON_REQUEST" ] && args+=(--request "$HARPOON_REQUEST")
        while IFS= read -r line; do
          [ -z "$line" ] && continue
          args+=(-V "$line")
        done <<< "$HARPOON_VARS"
        harpoon "${args[@]}"

    - name: Share HTML report
      id: share
      if: ${{ always() && inputs.share == 'true' }}
      shell: bash
      continue-on-error: true
      env:
        SHARE_SERVER: ${{ inputs.share-server }}
      run: |
        payload=$(jq -n --rawfile html harpoon-report.html '{html: $html, collection: "ci-report"}')
        curl -sf -X POST "$SHARE_SERVER/api/reports" \
          -H "Content-Type: application/json" \
          -d "$payload" \
          | jq -r '"url=\(.url)"' >> "$GITHUB_OUTPUT"

    - name: Post PR comment
      if: ${{ always() && inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token != '' && inputs.token || github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT: ${{ github.sha }}
        SHARE_URL: ${{ steps.share.outputs.url }}
      run: |
        summary=$(jq -r '"\(.passed)/\(.passed + .failed) passed"' harpoon-report.json)
        {
          echo "## 🎯 harpoon smoke test — ${summary}"
          echo ""
          echo "| Request | Method | Status | Time | Result |"
          echo "|---|---|---|---|---|"
          jq -r '.results[] | "| \(.name) | \(.method) | \(if .status == 0 then "-" else (.status | tostring) end) | \(.duration_ms | floor)ms | \(if .err then "❌ \(.err)" elif .failures then "❌ \(.failures | join("; "))" else "✅" end) |"' harpoon-report.json
          if [ -n "$SHARE_URL" ]; then
            echo ""
            echo "📄 [Open the full HTML report]($SHARE_URL) (expires in 90 days)"
          fi
          echo ""
          echo "<sub>commit ${COMMIT:0:7} · generated by harpoon ci</sub>"
        } > harpoon-comment.md
        gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file harpoon-comment.md

    - name: Upload HTML report
      if: ${{ always() && inputs.html-artifact != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.html-artifact }}
        path: harpoon-report.html
